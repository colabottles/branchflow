<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .ring { fill: none; stroke: #179287; stroke-width: 2.5; }
    .dot { fill: #179287; }
    .line { stroke: #179287; stroke-width: 2; opacity: 0.5; }
  </style>
  <!-- vertical lane line -->
  <line class="line" x1="16" y1="2" x2="16" y2="30" />
  <!-- branch line -->
  <path class="line" d="M16 16 C16 10 26 10 26 6" fill="none" />
  <!-- outer ring -->
  <circle class="ring" cx="16" cy="16" r="6" />
  <!-- inner dot -->
  <circle class="dot" cx="16" cy="16" r="3" />
</svg>
